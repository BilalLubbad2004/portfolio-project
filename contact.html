<!DOCTYPE html>
<html>
<head>
    <title>Contact Me</title>
</head>
<body>
    <h1>Contact Me</h1>

    <form>
        <label>Name:</label>
        <input type="text" placeholder="Enter your name">

        <br><br>

        <label>Email:</label>
        <input type="email" placeholder="Enter your email">

        <br><br>

        <label>Message:</label>
        <textarea placeholder="Enter your message"></textarea>

        <br><br>

        <button type="submit">Send</button>
    </form>
</body>
</html>
